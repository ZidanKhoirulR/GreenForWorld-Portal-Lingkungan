<h2>Edit Foto Galeri</h2>

<form method="POST" enctype="multipart/form-data">
  <label>Judul:</label><br>
  <input type="text" name="judul" value="{{ @item.judul }}" required><br><br>

  <label>Deskripsi:</label><br>
  <textarea name="deskripsi" rows="4" cols="40">{{ @item.deskripsi }}</textarea><br><br>

  <label>Kategori:</label><br>
  <input type="text" name="kategori" value="{{ @item.kategori }}"><br><br>

  <label>Tanggal:</label><br>
  <input type="date" name="tanggal" value="{{ @item.tanggal }}"><br><br>

  <label>Gambar Lama:</label><br>
  <img src="/uploads/{{ @item.gambar }}" width="150"><br><br>

  <label>Ganti Gambar:</label><br>
  <input type="file" name="gambar" accept="image/*"><br><br>

  <button type="submit">Simpan Perubahan</button>
</form>
