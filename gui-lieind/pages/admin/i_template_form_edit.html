<!-- Page Header -->
<div class="page-header row no-gutters py-4">
  <div class="col-12 col-sm-4 text-center text-sm-left mb-0">
    <span class="text-uppercase page-subtitle">Blog Posts</span>
    <h3 class="page-title">Edit Artikel</h3>
  </div>

  <check if="{{ @error }}">
    <div class="alert alert-danger">{{ @error }}</div>
  </check>
</div>
<!-- End Page Header -->

<form id="form-artikel" method="post" action="{{ @BASE }}/admin/artikel/edit/{{ @id }}">
  <div class="row">
    <div class="col-lg-9 col-md-12">
      <div class="card card-small mb-3">
        <div class="card-body">

          <input
            class="form-control form-control-lg mb-3"
            type="text"
            name="judul"
            placeholder="Judul Artikel"
            value="{{ @judul }}">

          <textarea
            name="isi"
            id="editor"
            class="form-control form-control-lg mb-3"
            rows="20"
            placeholder="Isi Artikel">{{ @isi }}</textarea>

          <input type="hidden" name="csrf" value="{{ @CSRF }}">

        </div>
      </div>
    </div>

    <div class="col-lg-3 col-md-12">
      <div class="card card-small mb-3">
        <div class="card-header border-bottom">
          <h6 class="m-0">Actions</h6>
        </div>
        <div class="card-body p-0">
          <ul class="list-group list-group-flush">

            <F3:check if="{{ @status }} == 0">
              <F3:true>
                <li class="list-group-item p-3">
                  <span class="d-flex mb-2">
                    <i class="material-icons mr-1">flag</i>
                    <strong class="mr-1">Status:</strong> Draft
                  </span>
                </li>
              </F3:true>
            </F3:check>

            <F3:check if="{{ @status }} == 1">
              <F3:true>
                <li class="list-group-item p-3">
                  <span class="d-flex mb-2">
                    <i class="material-icons mr-1">visibility</i>
                    <strong class="mr-1">Visibility:</strong>
                    <strong class="text-success">Public</strong>
                  </span>
                </li>
              </F3:true>
            </F3:check>

            <li class="list-group-item d-flex px-3">
              <button type="submit" name="status" value="0" class="btn btn-sm btn-outline-accent">
                <i class="material-icons">save</i> Save Draft
              </button>

              <button type="submit" name="status" value="1" class="btn btn-sm btn-accent ml-auto">
                <i class="material-icons">file_copy</i> Publish
              </button>
            </li>

          </ul>
        </div>
      </div>
    </div>
  </div>
</form>

<!-- Modal Notifikasi -->
<div class="modal fade" id="notifModal" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-warning text-white">
        <h5 class="modal-title">Peringatan</h5>
        <button type="button" class="close text-white" data-dismiss="modal">
          <span>&times;</span>
        </button>
      </div>
      <div class="modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-warning" data-dismiss="modal">Tutup</button>
      </div>
    </div>
  </div>
</div>

<!-- CKEditor -->
<script src="https://cdn.ckeditor.com/ckeditor5/41.0.0/classic/ckeditor.js"></script>

<script>
/* ============================
   UPLOAD ADAPTER (WAJIB)
============================ */
class MyUploadAdapter {
  constructor(loader) {
    this.loader = loader;
  }

  upload() {
    return this.loader.file.then(file => {
      return new Promise((resolve, reject) => {
        const data = new FormData();
        data.append('upload', file);

        fetch('{{ @BASE }}/admin/artikel/upload-image', {
          method: 'POST',
          body: data
        })
        .then(res => res.json())
        .then(res => {
          if (res.url) {
            resolve({ default: res.url });
          } else {
            reject(res.error || 'Upload gagal');
          }
        })
        .catch(err => reject(err));
      });
    });
  }

  abort() {}
}

function MyCustomUploadAdapterPlugin(editor) {
  editor.plugins.get('FileRepository').createUploadAdapter = loader => {
    return new MyUploadAdapter(loader);
  };
}
</script>

<script>
/* ============================
   INIT CKEDITOR
============================ */
let editorEdit;

document.addEventListener('DOMContentLoaded', function () {
  ClassicEditor.create(document.querySelector('#editor'), {
    extraPlugins: [ MyCustomUploadAdapterPlugin ],
    toolbar: {
      items: [
        'heading',
        '|',
        'bold',
        'italic',
        'underline',
        '|',
        'alignment',
        'bulletedList',
        'numberedList',
        '|',
        'insertImage',
        'blockQuote',
        'undo',
        'redo'
      ]
    },
    alignment: {
      options: ['left', 'center', 'right', 'justify']
    }
  })
  .then(editor => {
    editorEdit = editor;
  })
  .catch(error => {
    console.error('CKEditor error:', error);
  });
});
</script>

<script>
/* ============================
   VALIDASI & SUBMIT FORM
============================ */
document.getElementById('form-artikel').addEventListener('submit', function (e) {

  if (editorEdit) {
    document.querySelector('[name="isi"]').value = editorEdit.getData();
  }

  const judul = document.querySelector('[name="judul"]').value.trim();
  const isi   = document.querySelector('[name="isi"]').value.trim();

  let errorMessage = '';

  if (judul === '' || isi === '') {
    errorMessage = 'Judul dan isi artikel tidak boleh kosong.';
  } else if (judul.length < 10 || isi.length < 200) {
    errorMessage = 'Judul minimal 10 karakter dan isi minimal 200 karakter.';
  }

  if (errorMessage !== '') {
    e.preventDefault();
    document.querySelector('#notifModal .modal-body').textContent = errorMessage;
    $('#notifModal').modal('show');
  }
});
</script>
