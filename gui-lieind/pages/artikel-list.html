<!DOCTYPE HTML>
<html>

<head>
	<title>GREEN FOR WORLD</title>
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<meta name="description" content="" />
	<meta name="keywords" content="" />
	<link href='http://fonts.googleapis.com/css?family=Arimo:400,700' rel='stylesheet' type='text/css'>
	<!--[if lte IE 8]><script src="{{@BASE}}/{{@GUI}}js/html5shiv.js"></script><![endif]-->
	<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>
	<script src="/gui-lieind/js/skel.min.js"></script>
	<script src="/gui-lieind/js/skel-panels.min.js"></script>
	<script src="/gui-lieind/js/init.js"></script>

	<link rel="stylesheet" href="/gui-lieind/css/skel-noscript.css" />
	<link rel="stylesheet" href="/gui-lieind/css/style.css" />
	<link rel="stylesheet" href="/gui-lieind/css/style-desktop.css" />

	<!--[if lte IE 8]><link rel="stylesheet" href="/website_lies/gui-lieind/css/ie/v8.css" /><![endif]-->
	<!--[if lte IE 9]><link rel="stylesheet" href="/website_lies/gui-lieind/css/ie/v9.css" /><![endif]-->
</head>

<body>

	<!-- Header -->
	<include href="gui-lieind/i_header.html" />

	<!-- Main -->
	<div id="main">
		<div class="container">
			<div class="row">

				<!-- Content -->
				<div id="content" class="12u skel-cell-important">

					<section>
						<header>
							<h2>Article List</h2>
						</header>

						<ul class="style">
							<repeat group="{{ @artikelList }}" value="{{ @artikel }}">
								<li>
									<h3><a href="/artikel/{{ @artikel.slug }}">{{ @artikel.judul }}</a>
									</h3>
									<p><small>Written by {{ @artikel.penulis }} on {{ @artikel.tanggal_diperbarui }}</small></p>
									<p>{{ @artikel.preview | raw }}...</p>
									<a href="/artikel/{{ @artikel.slug }}">More detail</a>
								</li>
							</repeat>
						</ul>
					</section>
				</div>

				<div class="paginationlies">
					Pages : <repeat group="{{ range(1, @totalPages) }}" value="{{ @i }}">
						<a href="{{ @BASE }}/article?page={{ @i }}" class="{{ @i == @currentPage ? 'active' : '' }}">{{
							@i }}</a>
					</repeat>
				</div>

			</div>
		</div>
	</div>


	<include href="gui-lieind/i_footer.html" />

</body>

</html>
