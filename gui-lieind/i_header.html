		@media (min-width:768px) {

		.header-blue .navbar .navbar-collapse span .login {

		}

		.header-blue .navbar .navbar-collapse span .login:hover {

		.header-blue .navbar .navbar-toggler {

		.header-blue .navbar .navbar-toggler:hover,

		.header-blue .navbar .navbar-nav a.active,

			}
		}

			}
		}

		.header-blue .navbar .navbar-nav>li>.dropdown-menu {
			margin-top: -5px;
			box-shadow: 0 4px 8px rgba(0, 0, 0, .1);

		.header-blue .navbar .dropdown-menu .dropdown-item:focus,

		.header-blue .action-button,

		}

		.header-blue .navbar .form-inline .search-field:focus {

		.header-blue .hero {

		.header-blue .hero p {

		.header-blue .phone-holder {
			text-align: right;
		}

		.header-blue div.iphone-mockup {
			position: relative;
			max-width: 300px;
			margin: 20px;
			display: inline-block;
		}

		.header-blue .iphone-mockup img.device {
			width: 100%;
			height: auto;
		}

		.header-blue .iphone-mockup .screen {
			position: absolute;
			width: 88%;
			height: 77%;
			top: 12%;
			border-radius: 2px;
			left: 6%;
			border: 1px solid #444;
			background-color: #aaa;
			overflow: hidden;
			background: url(../../assets/img/screen-content-iphone-6.jpg);
			background-size: cover;
			background-position: center;
		}

		.header-blue .iphone-mockup .screen:before {
			content: '';
			background-color: #fff;
			position: absolute;
			width: 70%;
			height: 140%;
			top: -12%;
			right: -60%;
			transform: rotate(-19deg);
			opacity: 0.2;
		}

		.header-blue .iphone-mockup .screen {
			display: none;
			/* Menonaktifkan layer screen yang menambahkan efek */
		}

		.header-blue .iphone-mockup .screen:before {
			display: none;
			/* Menghilangkan bayangan putih miring di kanan */
		}

		.header-blue div.iphone-mockup {
			box-shadow: none !important;
			/* Pastikan tidak ada bayangan dari container */
			background: transparent !important;
			border: none !important;
		}

		.header-blue .iphone-mockup img.device {
			box-shadow: none !important;
			/* Hilangkan bayangan dari gambar */
			border: none !important;
			background: transparent !important;
		}

		.header-blue div.iphone-mockup {
			max-width: 400px;
			/* sebelumnya 300px, sekarang lebih besar */
		}

		.header-blue .iphone-mockup img.device {
			width: 120%;
			/* perbesar gambar relatif terhadap container */
			height: auto;
		}


		@media (min-width:768px) {
			.header-blue {
				padding-bottom: 120px;
				/* versi layar besar */
			}
		}

		.navbar-nav .nav-link {
			position: relative;
			color: #fff;
			padding: 8px 16px;
			text-decoration: none;
			transition: color 0.3s ease;
		}

		.navbar-nav .nav-link::before,
		.navbar-nav .nav-link::after {
			position: absolute;
			left: 0;
			width: 100%;
			height: 2px;
			background: #fff;
			content: "";
			opacity: 0;
			transition: all 0.3s ease;
		}

		.navbar-nav .nav-link::before {
			top: 0;
			/* garis atas */
			transform: translateY(-5px);
		}

		.navbar-nav .nav-link::after {
			bottom: 0;
			/* garis bawah */
			transform: translateY(5px);
		}

		.navbar-nav .nav-link:hover::before,
		.navbar-nav .nav-link:hover::after {
			opacity: 1;
			transform: translateY(0);
			/* animasi garis masuk */
		}

		.navbar-nav .nav-link:hover {
			color: #fff;
		}

}

/* --- Search Wrapper Pill --- */
.search-wrapper {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 30px;
    padding: 4px 12px;
    transition: background 0.25s ease, border-color 0.25s ease;
    backdrop-filter: blur(4px);
}

.search-wrapper:focus-within {
    background: rgba(255,255,255,0.22);
    border-color: rgba(255,255,255,0.5);
}

.search-wrapper .fa-search {
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    margin-right: 7px;
    flex-shrink: 0;
}

.search-wrapper .search-field {
    background: transparent !important;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
    color: #fff !important;
    font-size: 13px !important;
    width: 140px;
    padding: 0 !important;
    height: auto !important;
    border-radius: 0 !important;
    transition: width 0.3s ease;
}

.search-wrapper .search-field:focus {
    width: 200px;
    box-shadow: none !important;
    outline: none !important;
}

.search-wrapper .search-field::placeholder {
    color: rgba(255,255,255,0.5);
}
